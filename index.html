<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#17212b" />
  <title>김지현 관점방</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="assets/avatar.jpg" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0e1621;
      --header: #17212b;
      --text: #f5f5f5;
      --bubble: #182533;
      --link: #6ab3f3;
      --blue: #2aabee;
      --chip: #25303d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: #0b0f14; color: var(--text); font-family: "Noto Sans KR", "Segoe UI", sans-serif; }
    body { display: grid; place-items: center; }
    .app-window {
      width: min(430px, 100vw);
      height: min(860px, 100vh);
      background: var(--bg);
      display: flex; flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,.55);
    }
    @media (max-width: 480px) { .app-window { width: 100vw; height: 100vh; } }
    .winbar {
      height: 36px; background: #1b2733; display: flex; align-items: center; justify-content: space-between;
      padding: 0 10px 0 14px; color: #9aa8b4; font-size: 13px; flex-shrink: 0;
    }
    .winbar .dots { display: flex; gap: 8px; }
    .winbar i { width: 12px; height: 12px; border-radius: 2px; display: inline-block; background: #3d4b58; }
    .winbar .cls { background: #e04f4f; }
    header.tg {
      height: 60px; background: var(--header); display: flex; align-items: center; gap: 10px;
      padding: 8px 12px; flex-shrink: 0;
    }
    .back { width: 28px; color: #d7e3ee; font-size: 26px; line-height: 1; }
    .avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; }
    .who { flex: 1; min-width: 0; }
    .who h1 { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
    .who p { font-size: 13px; color: #8fa1b0; margin-top: 1px; }
    .icon-btn { width: 36px; height: 36px; display: grid; place-items: center; color: #c5d3de; cursor: pointer; }
    .icon-btn svg { width: 22px; height: 22px; display: block; }
    .feed { flex: 1; overflow-y: auto; padding: 10px 8px 12px; background: var(--bg); }
    .feed::-webkit-scrollbar { width: 0; }
    .date-chip { display: flex; justify-content: center; margin: 10px 0 14px; }
    .date-chip span { background: #1c2a38; color: #ffffff; font-size: 14px; font-weight: 700; padding: 5px 12px; border-radius: 20px; }
    .msg {
      position: relative;
      background: var(--bubble);
      border-radius: 14px 14px 3px 14px;
      padding: 10px 12px 8px;
      margin: 0 20px 10px 10%;
      max-width: 90%;
      width: auto;
    }
    .msg::after {
      content: "";
      position: absolute;
      right: -11px;
      bottom: 0;
      width: 20px;
      height: 28px;
      background: var(--bubble);
      clip-path: path("M0 2 C1 14 8 24 20 28 L0 28 Z");
    }
    .msg .author { color: var(--blue); font-size: 14px; font-weight: 700; margin-bottom: 6px; }
    .photos { margin: 6px -12px 8px; }
    .photos img { width: 100%; display: block; max-height: 360px; object-fit: cover; }
    .msg .txt { font-size: 15px; font-weight: 400; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
    .msg .txt a { color: var(--link); text-decoration: none; }
    .msg .disc { margin-top: 12px; font-size: 14px; font-weight: 400; font-style: italic; color: #d7e0e8; line-height: 1.5; }
    .yt { margin-top: 10px; border-left: 3px solid #7b5cff; background: #1b2836; border-radius: 0 8px 8px 0; overflow: hidden; display: block; color: inherit; text-decoration: none; }
    .yt .meta { padding: 8px 10px 6px; }
    .yt .meta small { color: #8b9aa8; font-size: 12px; }
    .yt .meta b { display: block; font-size: 14px; margin: 3px 0; }
    .yt .meta p { color: #9aafbf; font-size: 13px; white-space: pre-wrap; }
    .yt .thumb { position: relative; width: 100%; aspect-ratio: 16 / 9; }
    .yt .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .yt .play { display: none; }
    .row { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; margin-top: 8px; }
    .reacts { display: flex; gap: 6px; }
    .chip {
      border: 0;
      background: #1c3345;
      color: #71bbfa;
      border-radius: 18px;
      padding: 5px 10px 5px 8px;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0;
      cursor: pointer;
      font-family: "Noto Sans KR", "Segoe UI", sans-serif;
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      line-height: 1;
      height: 30px;
    }
    .chip svg { width: 16px; height: 16px; display: block; flex-shrink: 0; }
    .chip.on { background: #3f96d0; color: #ffffff; }
    .chip.pulse { animation: pulse .28s ease; }
    @keyframes pulse { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }
    .meta-right { color: #8aa0b0; font-size: 14px; display: flex; align-items: center; gap: 6px; white-space: nowrap; padding-bottom: 2px; }
    .side-emoji { font-size: 16px; margin-left: 4px; animation: popin .25s ease; }
    @keyframes popin { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .burst-layer { position: fixed; inset: 0; pointer-events: none; z-index: 9999; overflow: hidden; }
    .spark {
      position: fixed; pointer-events: none; border-radius: 50%;
      animation: fly var(--d) cubic-bezier(.12,.7,.3,1) forwards;
    }
    .spark.emoji { background: none; border-radius: 0; font-size: 14px; line-height: 1; }
    @keyframes fly {
      0% { transform: translate(0,0) scale(1) rotate(0deg); opacity: 1; }
      70% { opacity: 1; }
      100% { transform: translate(var(--x), var(--y)) scale(0) rotate(var(--r)); opacity: 0; }
    }
    footer.composer {
      background: #17212b;
      border-top: 1px solid #0e1621;
      min-height: 54px;
      display: flex;
      align-items: flex-end;
      gap: 2px;
      padding: 6px 6px 8px;
      flex-shrink: 0;
      position: relative;
    }
    .c-btn {
      width: 40px;
      height: 42px;
      border: 0;
      background: transparent;
      color: #8d9aa6;
      display: grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
      padding: 0;
    }
    .c-btn svg { width: 24px; height: 24px; display: block; }
    .box {
      flex: 1;
      min-width: 0;
      background: #242f3d;
      border-radius: 20px;
      min-height: 42px;
      display: flex;
      align-items: center;
      padding: 0 4px 0 14px;
    }
    .box textarea {
      flex: 1;
      border: 0;
      resize: none;
      background: transparent;
      color: #fff;
      font: 16px/1.35 "Noto Sans KR", "Segoe UI", sans-serif;
      max-height: 120px;
      padding: 10px 0;
      outline: none;
    }
    .box textarea::placeholder { color: #7f8c98; }
    .emoji-pop {
      position: absolute;
      right: 48px;
      bottom: 58px;
      background: #1c2733;
      border-radius: 12px;
      padding: 8px;
      display: none;
      gap: 4px;
      flex-wrap: wrap;
      width: 220px;
      box-shadow: 0 8px 24px rgba(0,0,0,.4);
      z-index: 5;
    }
    .emoji-pop.open { display: flex; }
    .emoji-pop button {
      border: 0;
      background: transparent;
      font-size: 22px;
      width: 36px;
      height: 36px;
      cursor: pointer;
    }
    .attach-preview {
      position: absolute;
      left: 12px;
      bottom: 58px;
      background: #1c2733;
      border-radius: 10px;
      padding: 6px;
      display: none;
      z-index: 5;
    }
    .attach-preview.open { display: block; }
    .attach-preview img { width: 72px; height: 72px; object-fit: cover; border-radius: 6px; display: block; }
  </style>
</head>
<body>
  <div class="app-window">
    <div class="winbar">
      <span id="winTitle">김지현 관점방</span>
      <div class="dots"><i></i><i></i><i class="cls"></i></div>
    </div>
    <header class="tg">
      <div class="back">‹</div>
      <img class="avatar" id="avatar" src="assets/avatar.jpg" alt="프로필" />
      <div class="who">
        <h1><span id="name">김지현 관점방</span><span id="badge"></span></h1>
        <p id="subs">구독자 11,786명</p>
      </div>
      <div class="icon-btn" aria-label="검색">
        <svg viewBox="0 0 24 24" fill="none" stroke="#b7c2cc" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="6.5"></circle>
          <path d="M16.2 16.2L20.5 20.5"></path>
        </svg>
      </div>
      <div class="icon-btn" aria-label="메뉴">
        <svg viewBox="0 0 24 24" fill="#b7c2cc">
          <circle cx="12" cy="6" r="1.7"></circle>
          <circle cx="12" cy="12" r="1.7"></circle>
          <circle cx="12" cy="18" r="1.7"></circle>
        </svg>
      </div>
    </header>
    <div class="feed" id="feed"></div>
    <footer class="composer">
      <div class="attach-preview" id="attachPreview"><img id="attachImg" alt="" /></div>
      <div class="emoji-pop" id="emojiPop"></div>
      <button class="c-btn" id="clipBtn" type="button" aria-label="첨부">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 12.5l6.2-6.2a3.2 3.2 0 114.5 4.5L10.2 19.3a4.6 4.6 0 01-6.5-6.5l8.4-8.4"></path>
        </svg>
      </button>
      <input id="filePick" type="file" accept="image/*" hidden />
      <div class="box">
        <textarea id="draft" rows="1" placeholder="메시지 작성..."></textarea>
        <button class="c-btn" id="emojiBtn" type="button" aria-label="이모지">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="12" r="8.2"></circle>
            <path d="M8.6 14.2c.9 1.3 2.1 1.9 3.4 1.9s2.5-.6 3.4-1.9" stroke-linecap="round"></path>
            <circle cx="9.2" cy="10.2" r="0.9" fill="currentColor" stroke="none"></circle>
            <circle cx="14.8" cy="10.2" r="0.9" fill="currentColor" stroke="none"></circle>
          </svg>
        </button>
      </div>
      <button class="c-btn" id="sendBtn" type="button" aria-label="보내기">
        <svg id="micIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <rect x="9" y="3.5" width="6" height="11" rx="3"></rect>
          <path d="M6.5 11.5a5.5 5.5 0 0011 0M12 17v3.2"></path>
        </svg>
        <svg id="sendIcon" viewBox="0 0 24 24" fill="#2aabee" style="display:none">
          <path d="M3.4 11.2l16.8-7.4c.8-.3 1.5.5 1.1 1.3L15.2 20c-.4.9-1.6.8-1.9-.1l-2.2-6.6-6.6-2.2c-.9-.3-1-1.5-.1-1.9z"></path>
        </svg>
      </button>
    </footer>
  </div>
  <div class="burst-layer" id="burst"></div>
  <script src="chats.js"></script>
  <script>
    (function () {
      var S = window.SITE || {};
      var list = (window.CHATS || []).slice();
      var LIVE = "tg-live-posts-v1";
      try {
        JSON.parse(localStorage.getItem(LIVE) || "[]").forEach(function (p) { list.push(p); });
      } catch (e) {}
      var KEY = "tg-react-v1";
      function load() { try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { return {}; } }
      function save(data) { localStorage.setItem(KEY, JSON.stringify(data)); }
      var store = load();
      document.getElementById("name").textContent = S.channelName || "";
      document.getElementById("badge").textContent = S.badge || "";
      document.getElementById("subs").textContent = S.subscribers || "";
      document.getElementById("winTitle").textContent = S.channelName || "";
      document.title = S.channelName || document.title;
      if (S.avatar) document.getElementById("avatar").src = S.avatar;
      var HEART_ICON = "❤️";
      var LIKE_ICON = "👍";
      function linkify(text) { return String(text).replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>'); }
      function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
      function getState(post) {
        var s = store[post.id] || {};
        if (s.viewsSeen !== true) {
          s.viewsSeen = true;
          s.views = (post.views || 0) + 1;
          store[post.id] = s;
          save(store);
        }
        return {
          heartOn: !!s.heartOn,
          likeOn: !!s.likeOn,
          hearts: (post.hearts || 0) + (s.heartOn ? 1 : 0),
          likes: (post.likes || 0) + (s.likeOn ? 1 : 0),
          views: s.views || post.views || 0
        };
      }
      function photoHtml(src) {
        if (String(src).indexOf("data:") === 0) return '<img src="' + src + '" alt="" />';
        var base = String(src).replace(/\.(png|jpe?g|webp|gif)$/i, "");
        var tries = [src];
        [".png", ".PNG", ".jpg", ".JPG", ".jpeg", ".JPEG", ".webp"].forEach(function (ext) {
          if (tries.indexOf(base + ext) < 0) tries.push(base + ext);
        });
        return '<img src="' + esc(tries[0]) + '" data-try="' + esc(tries.slice(1).join("|")) + '" alt="" onerror="var n=(this.getAttribute(\'data-try\')||\'\').split(\'|\').filter(Boolean);if(!n.length){this.style.display=\'none\';return;}this.setAttribute(\'data-try\',n.slice(1).join(\'|\'));this.src=n[0];" />';
      }
      function render() {
        document.getElementById("feed").innerHTML = list.map(function (item) {
          if (item.type === "date") return '<div class="date-chip"><span>' + esc(item.text) + "</span></div>";
          var st = getState(item);
          var photos = "";
          var imgs = item.images || (item.image ? [item.image] : []);
          if (imgs.length) {
            photos = '<div class="photos">' + imgs.map(photoHtml).join("") + "</div>";
          }
          var yt = "";
          if (item.youtube) {
            yt = '<a class="yt" href="' + esc(item.youtube.url) + '" target="_blank" rel="noopener">' +
              '<div class="meta"><small>' + esc(item.youtube.label || "YouTube") + "</small>" +
              "<b>" + esc(item.youtube.title || "") + "</b><p>" + esc(item.youtube.desc || "") + "</p></div>" +
              '<div class="thumb"><img src="' + esc(item.youtube.thumb) + '" alt="썸네일" width="1920" height="1080" /></div></a>';
          }
          return '<article class="msg" data-id="' + esc(item.id) + '">' +
            '<div class="author">' + esc(S.channelName || "") + (S.badge ? " " + S.badge : "") + "</div>" +
            photos +
            '<div class="txt">' + linkify(esc(item.text || "")) + "</div>" +
            (item.disclaimer ? '<div class="disc">' + esc(item.disclaimer) + "</div>" : "") + yt +
            '<div class="row"><div class="reacts">' +
              '<button class="chip' + (st.heartOn ? " on" : "") + '" data-kind="heart">' + HEART_ICON + " " + st.hearts + "</button>" +
              '<button class="chip' + (st.likeOn ? " on" : "") + '" data-kind="like">' + LIKE_ICON + " " + st.likes + "</button>" +
            '</div><div class="meta-right">👁 ' + st.views + " &nbsp;" + esc(item.time || "") + "</div></div></article>";
        }).join("");
      }
      function burst(el, kind, turningOn) {
        var layer = document.getElementById("burst");
        if (!layer) return;
        var r = el.getBoundingClientRect();
        var cx = r.left + r.width / 2;
        var cy = r.top + r.height / 2;
        var colors = kind === "heart"
          ? ["#ff4d6d", "#ff8fab", "#2ee6a6", "#5ad2ff", "#ffd166", "#c77dff"]
          : ["#ffd166", "#ffe566", "#2ee6a6", "#5ad2ff", "#ff8fab", "#ffffff"];
        var emojis = kind === "heart" ? ["❤", "💗", "✨"] : ["👍", "✨", "💛"];
        var n = turningOn ? 28 : 10;
        for (var i = 0; i < n; i++) {
          var p = document.createElement("span");
          var isEmoji = i % 5 === 0;
          p.className = "spark" + (isEmoji ? " emoji" : "");
          var ang = (Math.PI * 2 * i) / n + Math.random() * 0.4;
          var dist = 36 + Math.random() * (turningOn ? 70 : 36);
          p.style.left = cx + "px";
          p.style.top = cy + "px";
          p.style.setProperty("--x", Math.cos(ang) * dist + "px");
          p.style.setProperty("--y", Math.sin(ang) * dist + "px");
          p.style.setProperty("--r", (Math.random() * 240 - 120) + "deg");
          p.style.setProperty("--d", (0.45 + Math.random() * 0.45) + "s");
          if (isEmoji) {
            p.textContent = emojis[i % emojis.length];
          } else {
            var size = 4 + Math.random() * 6;
            p.style.width = size + "px";
            p.style.height = size + "px";
            p.style.background = colors[i % colors.length];
          }
          layer.appendChild(p);
          setTimeout(function (node) { node.remove(); }, 900, p);
        }
      }
      document.getElementById("feed").addEventListener("click", function (e) {
        var btn = e.target.closest(".chip");
        if (!btn) return;
        var id = btn.closest(".msg").getAttribute("data-id");
        var kind = btn.getAttribute("data-kind");
        store[id] = store[id] || {};
        var nextOn = kind === "heart" ? !store[id].heartOn : !store[id].likeOn;
        burst(btn, kind, nextOn);
        if (kind === "heart") store[id].heartOn = nextOn;
        if (kind === "like") store[id].likeOn = nextOn;
        save(store);
        render();
        var again = document.querySelector('.msg[data-id="' + id + '"] .chip[data-kind="' + kind + '"]');
        if (again) {
          again.classList.add("pulse");
          setTimeout(function () { again.classList.remove("pulse"); }, 280);
        }
      });
      render();
      var draft = document.getElementById("draft");
      var sendBtn = document.getElementById("sendBtn");
      var micIcon = document.getElementById("micIcon");
      var sendIcon = document.getElementById("sendIcon");
      var emojiPop = document.getElementById("emojiPop");
      var filePick = document.getElementById("filePick");
      var pendingImage = "";
      var EMOJIS = ["😀","😁","😂","😊","😍","😭","😡","👍","❤️","🔥","✨","🙏","😎","🤔","👏","💯"];
      emojiPop.innerHTML = EMOJIS.map(function (e) {
        return '<button type="button" data-emoji="' + e + '">' + e + "</button>";
      }).join("");
      function syncSend() {
        var on = draft.value.trim() || pendingImage;
        micIcon.style.display = on ? "none" : "block";
        sendIcon.style.display = on ? "block" : "none";
      }
      function grow() {
        draft.style.height = "auto";
        draft.style.height = Math.min(draft.scrollHeight, 120) + "px";
      }
      draft.addEventListener("input", function () { syncSend(); grow(); });
      document.getElementById("emojiBtn").addEventListener("click", function () {
        emojiPop.classList.toggle("open");
      });
      emojiPop.addEventListener("click", function (e) {
        var b = e.target.closest("button");
        if (!b) return;
        draft.value += b.getAttribute("data-emoji");
        emojiPop.classList.remove("open");
        syncSend();
        draft.focus();
      });
      document.getElementById("clipBtn").addEventListener("click", function () { filePick.click(); });
      filePick.addEventListener("change", function () {
        var file = filePick.files && filePick.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function () {
          pendingImage = reader.result;
          document.getElementById("attachImg").src = pendingImage;
          document.getElementById("attachPreview").classList.add("open");
          syncSend();
        };
        reader.readAsDataURL(file);
      });
      function nowLabel() {
        var d = new Date();
        var h = d.getHours();
        var m = d.getMinutes();
        var ap = h < 12 ? "오전" : "오후";
        var hh = h % 12 || 12;
        return ap + " " + hh + ":" + (m < 10 ? "0" : "") + m;
      }
      function todayLabel() {
        var d = new Date();
        return (d.getMonth() + 1) + "월 " + d.getDate() + "일";
      }
      function send() {
        var text = draft.value.trim();
        if (!text && !pendingImage) return;
        var last = list[list.length - 1];
        var today = todayLabel();
        if (!last || last.type !== "date" && last.text !== today) {
          var hasToday = list.some(function (it) { return it.type === "date" && it.text === today; });
          if (!hasToday) list.push({ id: "day-" + Date.now(), type: "date", text: today });
        }
        var post = {
          id: "live-" + Date.now(),
          type: "post",
          text: text,
          hearts: 0,
          likes: 0,
          views: 1,
          time: nowLabel(),
          live: true
        };
        if (pendingImage) post.image = pendingImage;
        list.push(post);
        var saved = [];
        try { saved = JSON.parse(localStorage.getItem(LIVE) || "[]"); } catch (e) {}
        saved.push(post);
        if (!list.some(function (it) { return it.id === "day-" + today; }) ) {
          /* date chips from this session are not stored; re-add if needed on load */
        }
        try { localStorage.setItem(LIVE, JSON.stringify(saved)); } catch (e) {}
        draft.value = "";
        pendingImage = "";
        filePick.value = "";
        document.getElementById("attachPreview").classList.remove("open");
        emojiPop.classList.remove("open");
        grow();
        syncSend();
        render();
        var feed = document.getElementById("feed");
        feed.scrollTop = feed.scrollHeight;
      }
      sendBtn.addEventListener("click", send);
      draft.addEventListener("keydown", function (e) {
        if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
      });
      if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(function () {});
    })();
  </script>
</body>
</html>
