<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>김지현 관점방🎖</title>
  <meta name="description" content="김지현 관점방 · 중동 세력방" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b1016;
      --panel: #17212b;
      --panel-2: #1e2a36;
      --chat: #0e1621;
      --bubble: #182533;
      --line: #242f3d;
      --text: #e4ecf2;
      --muted: #8ea0b0;
      --gold: #d4af37;
      --gold-2: #f3d77a;
      --accent: #2aabee;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bg); color: var(--text); font-family: "Noto Sans KR", sans-serif; }
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 88px 320px minmax(0, 1fr);
    }

    .rail {
      background: #0a1118;
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 18px 0;
      gap: 18px;
    }
    .rail .dot {
      width: 48px; height: 48px; border-radius: 16px;
      display: grid; place-items: center;
      background: var(--panel-2);
      color: var(--muted);
      font-size: 20px;
    }
    .rail .dot.active {
      background: linear-gradient(145deg, #c9a227, #7a5a12);
      color: #111;
      box-shadow: 0 0 0 3px rgba(212,175,55,.25);
    }

    .side {
      background: var(--panel);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
    }
    .side-search { padding: 14px 14px 10px; }
    .side-search input {
      width: 100%;
      background: #242f3d;
      border: 0;
      border-radius: 22px;
      color: var(--text);
      padding: 11px 16px;
      outline: none;
      font-family: inherit;
    }
    .chat-item {
      display: flex; gap: 12px; align-items: center;
      padding: 10px 14px;
    }
    .chat-item.active { background: #2b5278; }
    .chat-item img {
      width: 52px; height: 52px; border-radius: 50%; object-fit: cover;
    }
    .chat-item h4 { font-size: 15px; font-weight: 600; }
    .chat-item p { font-size: 13px; color: #b8c4ce; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }

    .main { background: var(--chat); display: flex; flex-direction: column; min-height: 100vh; }
    .topbar {
      height: 64px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 18px;
      position: sticky; top: 0; z-index: 20;
    }
    .who { display: flex; align-items: center; gap: 12px; }
    .who img { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; }
    .who h1 { font-size: 16px; font-weight: 700; }
    .who span { font-size: 12px; color: var(--muted); }
    .join {
      background: var(--accent);
      color: #fff;
      border: 0;
      border-radius: 10px;
      padding: 10px 16px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      display: inline-block;
    }
    .join.gold {
      background: linear-gradient(180deg, #f1d36a, #b89020);
      color: #1a1404;
    }

    .hero { position: relative; height: 320px; overflow: hidden; }
    .hero img { width: 100%; height: 100%; object-fit: cover; }
    .hero-mask {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(14,22,33,.15), rgba(14,22,33,.92));
      display: flex; align-items: flex-end;
      padding: 28px;
    }
    .hero-copy h2 {
      font-family: Outfit, "Noto Sans KR", sans-serif;
      font-size: 34px; letter-spacing: -.5px;
    }
    .hero-copy p { color: #d7e0e8; margin-top: 6px; max-width: 720px; }
    .pills { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
    .pill {
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(212,175,55,.35);
      color: var(--gold-2);
      padding: 6px 10px; border-radius: 999px; font-size: 12px;
    }

    .feed {
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
      padding: 22px 16px 120px;
      display: flex; flex-direction: column; gap: 18px;
    }

    .date-sep { text-align: center; color: #c9d4de; font-size: 13px; }
    .date-sep span {
      background: rgba(24,37,51,.9);
      padding: 6px 12px;
      border-radius: 20px;
    }

    .post {
      background: var(--bubble);
      border-radius: 16px 16px 16px 4px;
      padding: 14px 14px 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,.18);
    }
    .post.pin { border: 1px solid rgba(42,171,238,.45); }
    .post .meta {
      display: flex; align-items: center; gap: 8px;
      color: var(--accent); font-weight: 700; font-size: 14px; margin-bottom: 8px;
    }
    .post .meta em { font-style: normal; color: var(--gold); font-size: 12px; margin-left: auto; }
    .post .txt { font-size: 15px; line-height: 1.65; white-space: pre-wrap; }
    .post img.shot {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-radius: 10px;
      margin: 12px 0 8px;
    }
    .react { display: flex; gap: 8px; margin-top: 8px; color: var(--muted); font-size: 13px; flex-wrap: wrap; }
    .react b { background: #242f3d; padding: 4px 8px; border-radius: 12px; font-weight: 600; color: #d7e3ec; }

    .notice {
      background: #1a2430;
      border-left: 3px solid var(--gold);
      padding: 14px 16px;
      border-radius: 8px;
      color: #c5d0da;
      font-size: 13px;
      line-height: 1.7;
    }

    .links { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .card-link {
      background: var(--panel-2);
      border-radius: 12px;
      padding: 14px;
      display: flex; gap: 12px; align-items: center;
    }
    .card-link strong { display: block; font-size: 14px; }
    .card-link span { color: var(--muted); font-size: 12px; }

    .footer-bar {
      position: sticky; bottom: 0;
      background: rgba(23,33,43,.94);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--line);
      padding: 12px 16px;
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
    }
    .footer-bar p { font-size: 12px; color: var(--muted); }

    @media (max-width: 980px) {
      .app { grid-template-columns: 1fr; }
      .rail, .side { display: none; }
      .hero { height: 240px; }
      .hero-copy h2 { font-size: 24px; }
      .links { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="rail">
      <div class="dot active">₿</div>
      <div class="dot">▶</div>
      <div class="dot">☰</div>
    </aside>

    <aside class="side">
      <div class="side-search"><input value="검색" readonly /></div>
      <div class="chat-item active">
        <img src="assets/QIjUt.jpg" alt="채널 프로필" />
        <div>
          <h4 id="sideName">김지현 관점방🎖</h4>
          <p id="sideDesc">중동 세력방</p>
        </div>
      </div>
      <div class="chat-item">
        <img src="assets/Qqpfp.jpg" alt="유튜브" />
        <div>
          <h4 id="sideYt">김지현 유튜브</h4>
          <p id="sideYtMeta">YouTube</p>
        </div>
      </div>
    </aside>

    <section class="main">
      <header class="topbar">
        <div class="who">
          <img src="assets/QIjUt.jpg" alt="avatar" />
          <div>
            <h1 id="topName">김지현 관점방🎖</h1>
            <span id="topMeta"></span>
          </div>
        </div>
        <a class="join" id="joinBtn" href="#" target="_blank" rel="noopener">채널 입장</a>
      </header>

      <div class="hero">
        <img src="assets/Ijzi1.jpg" alt="배너 1920x1080" width="1920" height="1080" />
        <div class="hero-mask">
          <div class="hero-copy">
            <h2 id="heroName">김지현 관점방🎖</h2>
            <p id="heroText"></p>
            <div class="pills" id="pills"></div>
          </div>
        </div>
      </div>

      <div class="feed" id="feed"></div>

      <div class="footer-bar">
        <p id="footerText"></p>
        <a class="join gold" id="footerBtn" href="#" target="_blank" rel="noopener">텔레그램에서 보기</a>
      </div>
    </section>
  </div>

  <script src="chats.js"></script>
  <script>
    (function () {
      var S = window.SITE || {};
      var list = window.CHATS || [];

      function setText(id, value) {
        var el = document.getElementById(id);
        if (el && value != null) el.textContent = value;
      }

      document.title = S.channelName || document.title;
      setText("sideName", S.channelName);
      setText("sideDesc", S.description);
      setText("sideYt", S.youtubeName);
      setText("sideYtMeta", S.youtubeMeta);
      setText("topName", S.channelName);
      setText("topMeta", (S.subscribers || "") + (S.username ? " · " + S.username : ""));
      setText("heroName", S.channelName);
      setText("heroText", S.heroText);
      setText("footerText", S.footerText);

      var joinBtn = document.getElementById("joinBtn");
      var footerBtn = document.getElementById("footerBtn");
      if (joinBtn) {
        joinBtn.href = S.joinUrl || "#";
        joinBtn.textContent = S.joinLabel || "채널 입장";
      }
      if (footerBtn) {
        footerBtn.href = S.joinUrl || "#";
        footerBtn.textContent = S.footerButton || "텔레그램에서 보기";
      }

      var pills = document.getElementById("pills");
      if (pills && S.pills) {
        pills.innerHTML = S.pills.map(function (p) {
          return '<span class="pill">' + p + "</span>";
        }).join("");
      }

      var feed = document.getElementById("feed");
      if (!feed) return;

      feed.innerHTML = list.map(function (item) {
        if (item.type === "notice") {
          return '<div class="notice">' + escapeHtml(item.text || "") + "</div>";
        }
        if (item.type === "date") {
          return '<p class="date-sep"><span>' + escapeHtml(item.text || "") + "</span></p>";
        }
        if (item.type === "links") {
          return (
            '<div class="links">' +
              '<a class="card-link" href="' + (S.joinUrl || "#") + '" target="_blank" rel="noopener">' +
                '<img src="assets/QIjUt.jpg" alt="TG" style="width:56px;height:56px;border-radius:50%;object-fit:cover" />' +
                "<div><strong>텔레그램 채널 입장</strong><span>" + escapeHtml(S.joinUrl || "") + "</span></div>" +
              "</a>" +
              '<a class="card-link" href="' + (S.youtubeUrl || "#") + '" target="_blank" rel="noopener">' +
                '<img src="assets/Ijzi1.jpg" alt="YT" style="width:56px;height:56px;border-radius:12px;object-fit:cover" />' +
                "<div><strong>" + escapeHtml(S.youtubeName || "유튜브") + "</strong><span>" + escapeHtml(S.youtubeMeta || "") + "</span></div>" +
              "</a>" +
            "</div>"
          );
        }

        var img = item.image
          ? '<img class="shot" src="' + item.image + '" alt="' + escapeHtml(item.imageAlt || "") + '" width="1920" height="1080" />'
          : "";
        var reacts = (item.reactions || []).map(function (r) {
          return "<b>" + escapeHtml(r) + "</b>";
        }).join("");

        return (
          '<div class="post' + (item.pinned ? " pin" : "") + '">' +
            '<div class="meta">' + escapeHtml(item.author || S.channelName || "") +
              "<em>" + escapeHtml(item.time || "") + "</em></div>" +
            '<div class="txt">' + escapeHtml(item.text || "") + "</div>" +
            img +
            (reacts ? '<div class="react">' + reacts + "</div>" : "") +
          "</div>"
        );
      }).join("");

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }
    })();
  </script>
</body>
</html>
